<div class="upload-container">
  <h1>Upload Contribution File</h1>
  
  <div class="upload-form">
    <div class="form-group">
      <label for="scheme">Scheme</label>
      <select id="scheme" [(value)]="selectedScheme" (input)="selectedScheme = $any($event.target).value" class="form-control">
        <option value="">Select a scheme</option>
        @for (scheme of schemes; track scheme.id) {
          <option [value]="scheme.id">{{ scheme.name }} ({{ scheme.code }})</option>
        }
      </select>
    </div>
    
    <div class="form-group">
      <label for="employer">Employer ID</label>
      <input type="text" id="employer" [(value)]="employerId" (input)="employerId = $any($event.target).value" class="form-control" placeholder="Enter employer ID">
    </div>
    
    <div class="form-group">
      <label for="period">Period</label>
      <input type="text" id="period" [(value)]="period" (input)="period = $any($event.target).value" class="form-control" placeholder="YYYY-MM (e.g., 2024-01)">
    </div>
    
    <div class="form-group">
      <label for="file">CSV File</label>
      <input type="file" id="file" (change)="onFileSelected($event)" accept=".csv" class="form-control">
    </div>
    
    <button (click)="uploadFile()" [disabled]="!selectedScheme || !employerId || !period || !selectedFile" class="btn btn-primary">
      Upload
    </button>
    
    @if (uploadStatus) {
      <div [class]="'upload-status ' + uploadStatus.type">
        {{ uploadStatus.message }}
      </div>
    }
  </div>
  
  <button routerLink="/" class="btn btn-secondary">Back to Dashboard</button>
</div>
