version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pensionbridge-postgres
    environment:
      - POSTGRES_DB=PensionBridge
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=YourStrong@Passw0rd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/PensionBridge.Api/Dockerfile
    container_name: pensionbridge-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__PensionBridge=Host=postgres;Port=5432;Database=PensionBridge;Username=postgres;Password=YourStrong@Passw0rd
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pensionbridge-network

  ui:
    build:
      context: ./src/PensionBridge.UI
      dockerfile: Dockerfile
    container_name: pensionbridge-ui
    ports:
      - "4200:80"
    depends_on:
      - api
    networks:
      - pensionbridge-network

volumes:
  postgres_data:

networks:
  pensionbridge-network:
    driver: bridge
